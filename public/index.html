<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qwen Proxy Workspace</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- DOMPurify for security -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body>
  <div class="app-container">
    
    <!-- Left Panel: Chat Interface -->
    <div class="chat-panel glass-panel">
      <header class="chat-header">
        <h1>Qwen<span>Proxy</span></h1>
        <div class="status-indicator">
          <span class="pulse"></span>
          <span class="status-text">Connected</span>
        </div>
      </header>
      
      <main class="chat-history" id="chatHistory">
        <!-- Messages will be injected here -->
        <div class="message system-msg">
          <div class="msg-avatar">🤖</div>
          <div class="msg-bubble">
            <p>Welcome to QwenProxy. I'm ready to generate code and artifacts for you.</p>
          </div>
        </div>
      </main>

      <footer class="chat-input-area">
        <form id="chatForm">
          <div class="input-wrapper">
            <textarea id="messageInput" placeholder="Ask Qwen to build something..." rows="1"></textarea>
            <button type="submit" id="sendBtn" class="send-btn">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
        </form>
      </footer>
    </div>

    <!-- Right Panel: Artifact UI -->
    <div class="artifact-panel glass-panel" id="artifactPanel">
      <header class="artifact-header">
        <div class="artifact-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
          <h2>Preview</h2>
        </div>
        <div class="artifact-actions">
          <button id="refreshArtifact" title="Reload Preview">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
          </button>
          <button id="toggleCode" title="View Source">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </button>
        </div>
      </header>
      
      <div class="artifact-content">
        <!-- The live preview frame -->
        <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
        
        <!-- The source code viewer (hidden by default) -->
        <div id="sourceViewer" class="hidden">
          <pre><code id="sourceCode"></code></pre>
        </div>
        
        <!-- Empty state -->
        <div id="emptyState" class="empty-state">
          <div class="empty-icon">✧</div>
          <p>Artifacts will appear here</p>
        </div>
      </div>
    </div>

  </div>
  
  <script src="app.js"></script>
</body>
</html>
